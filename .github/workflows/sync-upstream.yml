name: Sync upstream, merge, and release

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the full pipeline (including tests) without pushing, tagging, or releasing'
        type: boolean
        default: false
      sync_branch:
        description: 'Branch to sync (default: master). Use a throwaway branch for validation runs.'
        type: string
        default: master

# Serialize sync runs; two concurrent runs would race on the branch and the release tag.
concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_REPO: https://github.com/pymedusa/Medusa.git
  UPSTREAM_BRANCH: master

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Authoritative branch by default; a validation run may point at a throwaway branch.
      SYNC_BRANCH: ${{ inputs.sync_branch || 'master' }}
      DRY_RUN: ${{ inputs.dry_run || 'false' }}

    steps:
      - name: Checkout sync branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SYNC_BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch origin and upstream
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream "${UPSTREAM_REPO}"
          git fetch --prune origin
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

      # Detection and the build must describe the same tree, so HEAD is aligned with the branch
      # tip that was just fetched (the checkout may be older if the branch moved in between).
      - name: Align HEAD with fetched branch tip
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
          echo "HEAD is now $(git rev-parse HEAD) (origin/${SYNC_BRANCH})"

      - name: Detect upstream changes
        id: detect
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          upstream_sha="$(git rev-parse "upstream/${UPSTREAM_BRANCH}")"
          branch_sha="$(git rev-parse "origin/${SYNC_BRANCH}")"
          merge_base="$(git merge-base "origin/${SYNC_BRANCH}" "upstream/${UPSTREAM_BRANCH}")"
          upstream_ahead_count="$(git rev-list --count "${merge_base}..upstream/${UPSTREAM_BRANCH}")"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${SYNC_BRANCH}"; then
            merge_needed=false
          else
            merge_needed=true
          fi

          # Tagged per upstream commit: stable across retries, never a second release for an
          # unchanged upstream. Tag and release are separate so an interrupted publish can finish.
          tag="sync-$(git rev-parse --short "${upstream_sha}")"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            tag_needed=false
          else
            tag_needed=true
          fi
          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            release_exists=true
          else
            release_exists=false
          fi

          # Validation always runs: on a dry run, or whenever the tree may change or a release
          # still has to be cut. Only a settled, published branch with no dry run is a no-op.
          if [ "${DRY_RUN}" = "true" ] || [ "${merge_needed}" = "true" ] || [ "${release_exists}" = "false" ]; then
            build_needed=true
          else
            build_needed=false
          fi

          if [ "${build_needed}" = "true" ] && [ "${merge_needed}" = "false" ]; then
            publish_only=true
          else
            publish_only=false
          fi

          {
            echo "upstream_sha=${upstream_sha}"
            echo "branch_sha=${branch_sha}"
            echo "merge_base=${merge_base}"
            echo "upstream_ahead_count=${upstream_ahead_count}"
            echo "merge_needed=${merge_needed}"
            echo "tag_needed=${tag_needed}"
            echo "release_exists=${release_exists}"
            echo "build_needed=${build_needed}"
            echo "publish_only=${publish_only}"
            echo "tag=${tag}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Sync detection"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Dry run | ${DRY_RUN} |"
            echo "| Branch | \`${SYNC_BRANCH}\` |"
            echo "| Upstream head | \`${upstream_sha}\` |"
            echo "| Branch head | \`${branch_sha}\` |"
            echo "| Merge base | \`${merge_base}\` |"
            echo "| Upstream commits to merge | ${upstream_ahead_count} |"
            echo "| Merge needed | ${merge_needed} |"
            echo "| Tag needed | ${tag_needed} |"
            echo "| Release exists | ${release_exists} |"
            echo "| Validation needed | ${build_needed} |"
            echo "| Tag | \`${tag}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${build_needed}" = "false" ]; then
            echo "Nothing to do: the branch contains upstream and the release is published."
          elif [ "${merge_needed}" = "false" ]; then
            echo "Branch already contains upstream; validating the tree that will be released."
          else
            echo "Upstream has ${upstream_ahead_count} new commit(s) since ${merge_base}."
          fi

      - name: Merge upstream into sync branch
        if: steps.detect.outputs.merge_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # A path may be taken from upstream verbatim only when this job regenerates it from
          # tracked source. Everything else needs a human decision.
          is_auto_resolvable() {
            case "$1" in
              themes/dark/assets/js/* | themes/dark/assets/css/*) return 0 ;;
              themes/light/assets/js/* | themes/light/assets/css/*) return 0 ;;
              yarn.lock | themes-default/slim/yarn.lock | uv.lock) return 0 ;;
              *) return 1 ;;
            esac
          }

          merge_failed=false
          git merge --no-commit --no-ff "upstream/${UPSTREAM_BRANCH}" || merge_failed=true

          if [ "${merge_failed}" = "true" ]; then
            mapfile -t unmerged < <(git diff --name-only --diff-filter=U)
            if [ "${#unmerged[@]}" -eq 0 ]; then
              echo "::error::Merge failed without reported conflicts; refusing to continue."
              exit 1
            fi

            unresolved=()
            resolved=()
            for path in "${unmerged[@]}"; do
              if ! is_auto_resolvable "${path}"; then
                unresolved+=("${path}")
              elif git cat-file -e ":3:${path}" 2>/dev/null; then
                git checkout --theirs -- "${path}"
                git add -- "${path}"
                resolved+=("${path}")
                echo "auto-resolved from upstream: ${path}"
              elif git cat-file -e ":2:${path}" 2>/dev/null; then
                git rm -q -- "${path}"
                resolved+=("${path}")
                echo "auto-resolved (upstream deleted it): ${path}"
              else
                unresolved+=("${path}")
              fi
            done

            if [ "${#unresolved[@]}" -gt 0 ]; then
              {
                echo "### Sync aborted: conflicts need a human decision"
                echo ""
                echo "These paths conflicted and are not generated artifacts, so they were left alone:"
                echo ""
                for path in "${unresolved[@]}"; do echo "- \`${path}\`"; done
                echo ""
                echo "Nothing was pushed. Resolve these locally, then re-run this workflow."
              } >> "$GITHUB_STEP_SUMMARY"
              git merge --abort
              echo "::error::Unresolved source conflicts: ${unresolved[*]}"
              exit 1
            fi

            bad=()
            for path in "${resolved[@]+"${resolved[@]}"}"; do
              if [ -f "${path}" ] && grep -qE '^(<<<<<<< |>>>>>>> |=======$)' "${path}"; then
                bad+=("${path}")
              fi
            done
            if [ "${#bad[@]}" -gt 0 ]; then
              echo "::error::Conflict markers survived resolution in: ${bad[*]}"
              git merge --abort
              exit 1
            fi
          fi

          if [ -n "$(git diff --name-only --diff-filter=U)" ] || [ -n "$(git ls-files -u)" ]; then
            echo "::error::Unmerged index entries remain after conflict resolution."
            git diff --name-only --diff-filter=U || true
            git merge --abort
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD > /dev/null; then
            git commit -q -F - <<'COMMIT_MSG'
          sync: merge upstream ${UPSTREAM_BRANCH} into ${SYNC_BRANCH}

          Automated merge of ${UPSTREAM_REPO} ${UPSTREAM_BRANCH}.
          Generated theme assets and lockfiles are regenerated in the following steps.
          COMMIT_MSG
            echo "Created merge commit $(git rev-parse --short HEAD)."
          else
            echo "Merge was already up to date."
          fi

      - name: Set up Python tooling
        if: steps.detect.outputs.build_needed == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Set up Node.js 18
        if: steps.detect.outputs.build_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Reconcile lockfiles against merged manifests
        if: steps.detect.outputs.merge_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv lock
          yarn install --ignore-scripts
          cd themes-default/slim && yarn install --ignore-scripts
          cd ../..
          if [ -n "$(git status --porcelain -- uv.lock yarn.lock themes-default/slim/yarn.lock)" ]; then
            git add -- uv.lock yarn.lock themes-default/slim/yarn.lock
            git commit -q -m "chore(sync): reconcile lockfiles with merged manifests"
            echo "Committed reconciled lockfiles."
          else
            echo "Lockfiles already consistent."
          fi

      # The released commit is the existing tag's commit when a previous run tagged but failed to
      # publish; validation must then run on that exact tree, not on a newer branch tip.
      - name: Resolve and check out release target
        id: target
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.detect.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
            target_sha="$(git rev-parse "refs/tags/${tag}^{commit}")"
          else
            target_sha="$(git rev-parse HEAD)"
          fi

          head_sha="$(git rev-parse HEAD)"
          if [ "${target_sha}" != "${head_sha}" ]; then
            echo "Tag ${tag} already points at ${target_sha}; validating that commit instead of ${head_sha}."
            git checkout --detach "${target_sha}"
          fi

          {
            echo "tag=${tag}"
            echo "target_sha=${target_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        if: steps.detect.outputs.build_needed == 'true'
        working-directory: ./themes-default/slim
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Build frontend assets
        if: steps.detect.outputs.build_needed == 'true'
        working-directory: ./themes-default/slim
        run: yarn build

      - name: Backend tests
        if: steps.detect.outputs.build_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          uv sync --group dev
          uv pip install -r test_requirements.txt
          uv run pytest -q -p no:flake8 tests/clients tests/helpers tests/apiv2

      - name: Frontend tests
        if: steps.detect.outputs.build_needed == 'true'
        working-directory: ./themes-default/slim
        run: yarn test --silent

      - name: Commit regenerated artifacts
        id: artifacts
        if: steps.detect.outputs.merge_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          # An automated run may only commit regenerated build outputs and lockfiles.
          git add -A -- themes/dark/assets themes/light/assets
          git add -A -- yarn.lock themes-default/slim/yarn.lock uv.lock

          if git diff --cached --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No regenerated artifacts to commit."
            exit 0
          fi

          git commit -q -m "chore(sync): rebuild tracked assets and lockfiles from merged source"
          echo "committed=true" >> "$GITHUB_OUTPUT"
          echo "Committed regenerated artifacts: $(git rev-parse --short HEAD)"

      - name: Push sync branch
        if: steps.detect.outputs.merge_needed == 'true' && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail
          # Fast-forward only: the sync never rewrites published history.
          git push origin "HEAD:${SYNC_BRANCH}"

      - name: Create tag for sync release
        id: tag
        if: steps.detect.outputs.tag_needed == 'true' && steps.detect.outputs.publish_only != 'true' && inputs.dry_run != true
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.detect.outputs.tag }}"
          head_sha="$(git rev-parse HEAD)"

          git cat-file -e "${head_sha}:.github/workflows/sync-upstream.yml"
          git cat-file -e "${head_sha}:.github/workflows/docker-release.yml"

          git tag "${tag}" "${head_sha}"
          git push origin "${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        if: steps.detect.outputs.release_exists == 'false' && inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          name: Sync ${{ steps.target.outputs.tag }}
          target_commitish: ${{ steps.target.outputs.target_sha }}
          generate_release_notes: true
          body: |
            Automated upstream merge.

            - Upstream repo: ${{ env.UPSTREAM_REPO }}
            - Upstream branch: ${{ env.UPSTREAM_BRANCH }}
            - Upstream head merged: ${{ steps.detect.outputs.upstream_sha }}
            - Branch before merge: ${{ steps.detect.outputs.branch_sha }}
            - Merge base before merge: ${{ steps.detect.outputs.merge_base }}
            - Upstream commits merged: ${{ steps.detect.outputs.upstream_ahead_count }}
            - Released commit: ${{ steps.target.outputs.target_sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
